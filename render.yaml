# Render Blueprint: managed PostgreSQL + FastAPI.
# Connect this GitHub repository in the Render dashboard to create the services.
# After the API URL exists, set CORS_ORIGINS to the Vercel origin and
# NEXT_PUBLIC_API_URL on the frontend to https://<api-host>/api/v1.

databases:
  - name: biowiki-pg
    plan: basic-256mb
    postgresMajorVersion: "17"

services:
  - type: web
    name: biowiki-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biowiki-pg
          property: connectionString
      - key: BIOWIKI_ENV
        value: production
      - key: BOOTSTRAP_SEED
        value: auto
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://.*\\.vercel\\.app
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS
        value: "180"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: API_KEYS
        value: ""
